<style>
  /* Layout: one framed column of hairline cells on cream, ruler band, full-bleed orange footer. Single committed look (Monumental house style). */
  :root {
    --cream: #FFFDEE;
    --indigo: #1A024D;
    --orange: #F74823;
    --wine: #721E3C;
    --ink-soft: rgba(26, 2, 77, 0.62);
    --serif: "Instrument Serif", "PP Editorial New", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", "Satoshi", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--indigo);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }
  .shell {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 24px 0;
  }
  .frame { border: 1px solid var(--indigo); border-bottom: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 20px; border-bottom: 1px solid var(--indigo);
  }
  .topbar svg { height: 34px; width: auto; display: block; }
  .eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; }
  .head { padding: 36px 20px 32px; border-bottom: 1px solid var(--indigo); }
  .head h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 0.98;
    margin: 0 0 14px; text-wrap: balance; letter-spacing: -0.01em;
  }
  .head h1 em { font-style: italic; color: var(--orange); }
  .head p { margin: 0; color: var(--ink-soft); max-width: 34ch; }
  .band { display: grid; grid-template-columns: repeat(6, 1fr); height: 2.4rem; border-bottom: 1px solid var(--indigo); }
  .band div + div { border-left: 1px solid var(--indigo); }
  .label { padding: 14px 20px 10px; border-bottom: 1px solid var(--indigo); }
  .links { list-style: none; margin: 0; padding: 0; }
  .links li { border-bottom: 1px solid var(--indigo); }
  .link {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    padding: 20px; color: var(--indigo); text-decoration: none;
    transition: background-color .15s ease, color .15s ease;
  }
  .link:hover, .link:focus-visible { background: var(--indigo); color: var(--cream); outline: none; }
  .link:focus-visible { box-shadow: inset 0 0 0 3px var(--orange); }
  .link .name { font-family: var(--serif); font-size: 1.75rem; line-height: 1.1; }
  .link .meta { display: block; font-size: 0.88rem; opacity: 0.7; margin-top: 4px; min-width: 0; overflow-wrap: anywhere; }
  .link .arrow { font-size: 1.4rem; line-height: 1; }
  .link.primary { background: var(--orange); }
  .link.primary:hover, .link.primary:focus-visible { background: var(--indigo); }
  .copyrow {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 20px 16px; border-top: 1px dashed var(--ink-soft);
  }
  .num { font-variant-numeric: tabular-nums; user-select: all; font-weight: 500; }
  .btn {
    font: 600 0.85rem var(--sans); color: var(--indigo); background: transparent;
    border: 1px solid var(--indigo); padding: 7px 14px; cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { background: var(--indigo); color: var(--cream); }
  .roles { padding: 22px 20px 26px; border-bottom: 1px solid var(--indigo); }
  .roles p { margin: 6px 0 0; color: var(--ink-soft); max-width: 46ch; }
  footer { background: var(--orange); color: var(--indigo); margin-top: 0; }
  footer .inner { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 32px; }
  footer svg { width: 100%; height: auto; display: block; }
  .topbar .who { font-family: var(--serif); font-size: 1.6rem; line-height: 1; }
  footer small { display: block; font-size: 0.9rem; font-weight: 500; }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 20px; border-bottom: 1px solid var(--indigo); }
  .qr img { width: 200px; height: 200px; image-rendering: pixelated; }
  .qr .url { font-size: 0.85rem; overflow-wrap: anywhere; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
